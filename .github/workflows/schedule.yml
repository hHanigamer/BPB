name: Send Soroush Reminder

on:
  schedule:
    - cron: '0 * * * *'  # هر ساعت یکبار، دقیقاً روی ساعت صفر
  workflow_dispatch:  # این یه دکمه برای اجرای دستی اضافه می‌کنه

jobs:
  run-reminder:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: pip install -r requirements.txt
      
    - name: Run reminder script
      run: python bot.py
      env:
        SOROUSH_PHONE: ${{ secrets.SOROUSH_PHONE }}
        TARGET_USER: ${{ secrets.TARGET_USER }}
